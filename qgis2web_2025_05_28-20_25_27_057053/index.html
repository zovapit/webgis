<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css"><link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/ServiceArea_1.js"></script>
        <script src="data/Roads_2.js"></script>
        <script src="data/BusStop_3.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString') {
              highlightLayer.setStyle({
                color: '#ffff00',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#ffff00',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:true, maxZoom:28, minZoom:1
        }).fitBounds([[-7.3381997738356315,112.71594238486914],[-7.249780960345631,112.88358594764816]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0]
        .innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0]
        .className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_EsriLightGray_0');
        map.getPane('pane_EsriLightGray_0').style.zIndex = 400;
        var layer_EsriLightGray_0 = L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_EsriLightGray_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
        });
        layer_EsriLightGray_0;
        map.addLayer(layer_EsriLightGray_0);
        function pop_ServiceArea_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (i in e.target._eventParents) {
                        e.target._eventParents[i].resetStyle(e.target);
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(feature.properties['id'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['cost_level'] !== null ? autolinker.link(feature.properties['cost_level'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
        }

        function style_ServiceArea_1_0() {
            return {
                pane: 'pane_ServiceArea_1',
                opacity: 1,
                color: 'rgba(229,74,69,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_ServiceArea_1');
        map.getPane('pane_ServiceArea_1').style.zIndex = 401;
        map.getPane('pane_ServiceArea_1').style['mix-blend-mode'] = 'normal';
        var layer_ServiceArea_1 = new L.geoJson(json_ServiceArea_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_ServiceArea_1',
            layerName: 'layer_ServiceArea_1',
            pane: 'pane_ServiceArea_1',
            onEachFeature: pop_ServiceArea_1,
            style: style_ServiceArea_1_0,
        });
        bounds_group.addLayer(layer_ServiceArea_1);
        map.addLayer(layer_ServiceArea_1);
        function pop_Roads_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (i in e.target._eventParents) {
                        e.target._eventParents[i].resetStyle(e.target);
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['full_id'] !== null ? autolinker.link(feature.properties['full_id'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['osm_id'] !== null ? autolinker.link(feature.properties['osm_id'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['osm_type'] !== null ? autolinker.link(feature.properties['osm_type'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['highway'] !== null ? autolinker.link(feature.properties['highway'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['name'] !== null ? autolinker.link(feature.properties['name'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
        }

        function style_Roads_2_0(feature) {
            switch(String(feature.properties['highway'])) {
                case 'primary':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(144,235,134,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'primary_link':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(171,234,22,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'residential':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(238,192,85,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'secondary':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(21,207,114,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'secondary_link':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(219,133,228,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'tertiary':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(158,121,237,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'tertiary_link':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(239,151,142,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'trunk':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(90,200,214,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'trunk_link':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(18,78,229,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
                case 'unclassified':
                    return {
                pane: 'pane_Roads_2',
                opacity: 1,
                color: 'rgba(206,28,117,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Roads_2');
        map.getPane('pane_Roads_2').style.zIndex = 402;
        map.getPane('pane_Roads_2').style['mix-blend-mode'] = 'normal';
        var layer_Roads_2 = new L.geoJson(json_Roads_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Roads_2',
            layerName: 'layer_Roads_2',
            pane: 'pane_Roads_2',
            onEachFeature: pop_Roads_2,
            style: style_Roads_2_0,
        });
        bounds_group.addLayer(layer_Roads_2);
        map.addLayer(layer_Roads_2);
        function pop_BusStop_3(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (i in e.target._eventParents) {
                        e.target._eventParents[i].resetStyle(e.target);
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['name'] !== null ? autolinker.link(feature.properties['name'].toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['highway'] !== null ? autolinker.link(feature.properties['highway'].toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
        }

        function style_BusStop_3_0() {
            return {
                pane: 'pane_BusStop_3',
                radius: 7.6,
                opacity: 1,
                color: 'rgba(50,87,128,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(72,123,182,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_BusStop_3');
        map.getPane('pane_BusStop_3').style.zIndex = 403;
        map.getPane('pane_BusStop_3').style['mix-blend-mode'] = 'normal';
        var layer_BusStop_3 = new L.geoJson(json_BusStop_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_BusStop_3',
            layerName: 'layer_BusStop_3',
            pane: 'pane_BusStop_3',
            onEachFeature: pop_BusStop_3,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_BusStop_3_0(feature));
            },
        });
        bounds_group.addLayer(layer_BusStop_3);
        map.addLayer(layer_BusStop_3);
        var baseMaps = {};
        L.control.layers(baseMaps,{'<img src="legend/BusStop_3.png" /> Bus Stop': layer_BusStop_3,'Roads<br /><table><tr><td style="text-align: center;"><img src="legend/Roads_2_primary0.png" /></td><td>primary</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_primarylink1.png" /></td><td>primary_link</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_residential2.png" /></td><td>residential</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_secondary3.png" /></td><td>secondary</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_secondarylink4.png" /></td><td>secondary_link</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_tertiary5.png" /></td><td>tertiary</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_tertiarylink6.png" /></td><td>tertiary_link</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_trunk7.png" /></td><td>trunk</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_trunklink8.png" /></td><td>trunk_link</td></tr><tr><td style="text-align: center;"><img src="legend/Roads_2_unclassified9.png" /></td><td>unclassified</td></tr></table>': layer_Roads_2,'<img src="legend/ServiceArea_1.png" /> Service Area': layer_ServiceArea_1,"Esri Light Gray": layer_EsriLightGray_0,}).addTo(map);
        setBounds();
        </script>
    </body>
</html>
